name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www
          cp "$(ls *.html | head -n 1)" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.example.myapp",
            "appName": "عضو بگیر سروش",
            "webDir": "www"
          }
          JSON
      - run: npx cap add android
      - name: Apply custom icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          im = Image.open('icon.png').convert('RGBA')
          base = 'android/app/src/main/res'
          os.system('rm -rf ' + base + '/mipmap-anydpi-v26')
          for d, s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p = f'{base}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              r = im.resize((s, s), Image.LANCZOS)
              for n in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  r.save(f'{p}/{n}.png')
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
